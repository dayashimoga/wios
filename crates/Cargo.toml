[workspace]
members = [
    "wios-core",
    "wios-crypto",
    "wios-storage",
    "wios-network",
    "wios-ai",
    "wios-compute",
    "wios-bridge",
    "wios-api",
    "wios-cli",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/user/wios"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
ring = "0.17"
ed25519-dalek = { version = "3", features = ["serde", "rand_core"] }
x25519-dalek = { version = "3", features = ["serde", "static_secrets"] }
aes-gcm = "0.11"
argon2 = "0.6"
rand = { version = "0.10.2", features = ["std", "std_rng"] }

# Storage
rusqlite = { version = "0.40", features = ["bundled", "backup", "functions"] }
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }

# Networking
libp2p = { version = "0.56", features = [
    "tcp", "quic", "noise", "yamux", "gossipsub",
    "mdns", "kad", "identify", "ping", "relay",
    "dns", "tokio", "macros", "serde",
] }

# gRPC / HTTP
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# AI / ML
ort = { version = "2", features = ["load-dynamic"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.15"

# Testing
mockall = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
