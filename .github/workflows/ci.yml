name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: crates

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates

      - name: Run tests
        run: cargo test --workspace --verbose
        working-directory: crates

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --workspace --out Xml --output-dir ../coverage
        working-directory: crates

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Build release
        run: cargo build --workspace --release
        working-directory: crates

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit
        working-directory: crates

  flutter-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos run analyze

      - name: Run tests
        run: melos run test

  build-web:
    name: Build Web
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter build web --release
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/wios_app/build/web

  build-android:
    name: Build Android
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter build apk --release
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/wios_app/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows
    needs: [flutter-analyze]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter build windows --release
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: apps/wios_app/build/windows/x64/runner/Release

  build-linux:
    name: Build Linux
    needs: [flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter build linux --release
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: apps/wios_app/build/linux/x64/release/bundle

  build-ios:
    name: Build iOS
    needs: [flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter build ios --release --no-codesign
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/wios_app/build/ios/iphoneos

  build-macos:
    name: Build macOS
    needs: [flutter-analyze]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter build macos --release
        working-directory: apps/wios_app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: apps/wios_app/build/macos/Build/Products/Release

  sbom-and-checksums:
    name: SBOM & Checksums
    needs: [rust-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json
        working-directory: crates
      - name: Build CLI release
        run: cargo build --release -p wios-cli
        working-directory: crates
      - name: Generate checksums
        run: |
          cd crates/target/release
          sha256sum wios > wios.sha256
          echo "SHA256: $(cat wios.sha256)"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-checksums
          path: |
            crates/bom.json
            crates/target/release/wios
            crates/target/release/wios.sha256
